[project]
authors = [{name = "zuble", email = "67658465+zuble@users.noreply.github.com"}]
name = "InquirerPy"
description = "Python port of Inquirer.js"
dependencies = [
    "prompt-toolkit>=3.0.1",
    "pfzy>=0.3.1",
]
requires-python = ">= 3.11"
version = "0.3.4"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
inquirerpy = { path = ".", editable = true }

[tool.pixi.tasks]
